name: Build D6300 firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev zstd python3-distutils libncurses-dev

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://git.openwrt.org/openwrt/openwrt.git openwrt-src
          cd openwrt-src
          git log --oneline -1 | tee ../openwrt-commit.txt
          git config user.email "ci@d6300.local"
          git config user.name "D6300 CI"

      - name: Apply D6300 patches
        run: |
          cd openwrt-src
          for p in ../openwrt/patches/0001-*.patch \
                   ../openwrt/patches/0002-*.patch \
                   ../openwrt/patches/0003-*.patch; do
            echo "== applying $p =="
            git am "$p"
          done
          git log --oneline -4

      - name: Patch bcm63xx-cfe package to include cferam.000
        run: |
          cd openwrt-src
          python3 - <<'PYEOF'
          import io, os, sys
          path = "package/kernel/bcm63xx-cfe/Makefile"
          src = io.open(path, encoding="utf-8").read()
          hook = "\ndefine Build/Prepare\n\t$(call Build/Prepare/Default)\n\t$(INSTALL_DIR) $(PKG_BUILD_DIR)/netgear,d6300\n\t$(CP) $(TOPDIR)/../openwrt/bcm63xx-cfe/netgear,d6300/cferam.000 $(PKG_BUILD_DIR)/netgear,d6300/cferam.000\nendef\n"
          if "define Build/Prepare" in src:
              print("hook gia' presente")
          else:
              marker = "include $(INCLUDE_DIR)/package.mk"
              if marker not in src:
                  print("ERRORE: marker non trovato nel Makefile")
                  sys.exit(1)
              src = src.replace(marker, marker + hook, 1)
              io.open(path, "w", encoding="utf-8").write(src)
              print("hook Build/Prepare aggiunto al package bcm63xx-cfe")
          for line in io.open(path, encoding="utf-8").read().splitlines():
              if "Build/Prepare" in line or "cferam" in line or "INSTALL_DIR" in line:
                  print("  " + line)
          PYEOF

      - name: Configure target
        run: |
          cd openwrt-src
          cat >> .config <<'CONFIGEOF'
          CONFIG_TARGET_bmips=y
          CONFIG_TARGET_bmips_bcm6362=y
          CONFIG_TARGET_bmips_bcm6362_DEVICE_netgear_d6300=y
          CONFIGEOF
          make defconfig
          grep -q "CONFIG_TARGET_bmips_bcm6362_DEVICE_netgear_d6300=y" .config \
            && echo "TARGET OK: netgear_d6300" \
            || { echo "ERRORE: device non selezionato"; exit 1; }

      - name: Download sources
        run: |
          cd openwrt-src
          make download -j8 V=s || make download -j1 V=s

      - name: Build firmware
        run: |
          cd openwrt-src
          set -euo pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Show build outputs
        if: always()
        run: |
          echo "=== cferam nello staging image ==="
          find openwrt-src/staging_dir -path "*bcm63xx-cfe*" -type f 2>/dev/null | head -n 20 || true
          echo "=== bin/targets ==="
          find openwrt-src/bin/targets -maxdepth 4 -type f 2>/dev/null | head -n 100 || true
          echo "=== ultime righe log ==="
          tail -n 120 openwrt-src/build.log 2>/dev/null || true

      - name: Collect images
        if: always()
        run: |
          mkdir -p out
          find openwrt-src/bin/targets/bmips/bcm6362 -maxdepth 2 -type f \
            -exec cp -v {} out/ \; 2>/dev/null || true
          cp openwrt-commit.txt out/ 2>/dev/null || true
          cp openwrt-src/build.log out/build.log 2>/dev/null || true
          echo "=== contenuto out/ ==="
          ls -la out/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d6300-openwrt-images
          path: out/
          if-no-files-found: warn
          retention-days: 30
